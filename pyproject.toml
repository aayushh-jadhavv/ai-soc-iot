[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-soc-ids"
version = "0.1.0"
description = "Phase 0 contracts and untrained temporal IDS export proof"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.9.0", "executorch==1.0.0", "numpy==2.2.6",
  "jsonschema==4.25.1", "psutil==7.1.3",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
records = ["pyarrow==22.0.0"]

[tool.setuptools.packages.find]
include = ["ids*", "contracts*"]

[tool.setuptools.package-data]
contracts = ["v1/*.json", "fixtures/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
