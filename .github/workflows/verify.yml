name: Verify IDS and gateway

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Install the locked CPU runtime
        run: |
          python -m pip install uv==0.9.10
          uv sync --frozen --python 3.12.12 --extra test --extra records --no-install-package coremltools
          uv pip install --python .venv/bin/python -r iot_gateway_final/requirements.txt
      - name: Test the IDS and gateway
        run: |
          .venv/bin/python -m pytest -q
          .venv/bin/python -m unittest discover -s iot_gateway_final/tests -q
          .venv/bin/python iot_gateway_final/replay_pcap.py --help
      - name: Rebuild the model and verify the published scores
        run: |
          .venv/bin/python -m ids.runtime pack
          .venv/bin/python -m evaluation.run verify
