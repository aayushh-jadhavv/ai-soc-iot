plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'org.raspigateway.demo'
    compileSdk 35

    defaultConfig {
        applicationId 'org.raspigateway.demo'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.3'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.pytorch:executorch-android:1.1.0'
}
